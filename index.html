<!DOCTYPE html>
<html lang="en" data-theme="violet">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://ssl.gstatic.com/classroom/favicon.png">
  <title>Home - Classroom</title>
  <meta name="description" content="A beautiful, animated AI chat app powered by Groq. Choose your own color palette." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />

  <!-- Markdown + sanitize + highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ============ SVG GRADIENT DEFS (Gemini animated fills) ============ -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <linearGradient id="geminiGradHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent)">
        <animate attributeName="stop-color" values="#6366f1;#a78bfa;#ec4899;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="var(--accent-2)">
        <animate attributeName="stop-color" values="#ec4899;#6366f1;#a78bfa;#ec4899" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="geminiGradWelcome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--accent)">
        <animate attributeName="stop-color" values="#6366f1;#a78bfa;#ec4899;#f6c177;#6366f1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="var(--accent-2)">
        <animate attributeName="stop-color" values="#a78bfa;#ec4899;#6366f1;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="var(--accent-2)">
        <animate attributeName="stop-color" values="#ec4899;#6366f1;#a78bfa;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
</svg>

  <!-- Atmospheric background blurs -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>
  </div>

  <!-- ============ HEADER ============ -->
  <header class="site-header" id="site-header">
    <a class="brand" href="#" aria-label="Nova AI home">
      <span class="brand-logo">
        <span class="brand-logo-glow"></span>
        <!-- Gemini star SVG (replaces fa-star) -->
        <svg class="gemini-logo-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 0 C12 6 13 11 24 12 C13 13 12 18 12 24 C12 18 11 13 0 12 C11 11 12 6 12 0 Z"/>
        </svg>
      </span>
      <span class="brand-text">
        <strong>TTM AI</strong>
        <small>POWERED BY GROQ</small>
      </span>
    </a>

    <div class="header-controls">
      <!-- Palette dots -->
      <div class="palette-dots" id="palette-dots" role="radiogroup" aria-label="Choose color theme">
        <button class="dot" data-theme="violet" style="--dot:#7c6bf5" role="radio" aria-label="Violet theme" title="Violet"></button>
        <button class="dot" data-theme="sky" style="--dot:#22b8ff" role="radio" aria-label="Sky theme" title="Sky"></button>
        <button class="dot" data-theme="blue" style="--dot:#2f6bff" role="radio" aria-label="Blue theme" title="Blue"></button>
        <button class="dot" data-theme="rose" style="--dot:#ff5d8f" role="radio" aria-label="Rose theme" title="Rose"></button>
        <button class="dot" data-theme="mono" style="--dot:#ffffff" role="radio" aria-label="Light theme" title="Light"></button>
        <button class="dot" data-theme="night" style="--dot:#0e0e12" role="radio" aria-label="Dark theme" title="Dark"></button>
      </div>

      <!-- Model selector -->
      <div class="model-select" id="model-select">
        <button class="model-pill" id="model-pill" aria-haspopup="listbox" aria-expanded="false">
          <span class="model-dot"></span>
          <span id="model-label">llama-3.3-70b</span>
          <i class="fa-solid fa-chevron-down"></i>
        </button>
        <ul class="model-menu" id="model-menu" role="listbox"></ul>
      </div>

      <!-- Settings -->
      <button class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="app-main">
    <!-- Empty / welcome state -->
    <section class="hero" id="hero">
      <div class="hero-icon">
        <span class="hero-icon-glow"></span>
        <span class="hero-icon-card">
          <!-- Sparkle particles -->
          <span class="sparkle-particle p1"></span>
          <span class="sparkle-particle p2"></span>
          <span class="sparkle-particle p3"></span>
          <span class="sparkle-particle p4"></span>
          <!-- Gemini large star SVG (replaces fa-star) -->
          <svg class="gemini-logo-svg-large" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0 C12 6 13 11 24 12 C13 13 12 18 12 24 C12 18 11 13 0 12 C11 11 12 6 12 0 Z"/>
          </svg>
        </span>
      </div>
      <h1 class="hero-title">WHAT CAN I HELP WITH?</h1>
      <p class="hero-sub">Made by TM — ask anything, paste images too. Go to groq.com to make get a API. To save it put it into the big doc we made.</p>
      <div class="chips" id="chips">
        <button class="chip" data-prompt="Explain quantum computing in simple terms.">Explain quantum computing</button>
        <button class="chip" data-prompt="Write me a short poem about the night sky.">Write me a poem</button>
        <button class="chip" data-prompt="Solve for t: 51 - 1 = 4t + 67. Show your steps.">Solve 51-1=4t+67</button>
        <button class="chip" data-prompt="Debug this JavaScript code and explain the fix: \nfunction add(a,b){retun a+b}">Debug my code</button>
      </div>
    </section>

    <!-- Conversation -->
    <section class="chat" id="chat" aria-live="polite"></section>
  </main>

  <!-- ============ INPUT BAR ============ -->
  <footer class="composer-wrap">
    <form class="composer" id="composer">
      <div class="composer-box">
        <div class="attachments" id="attachments"></div>
        <div class="composer-row">
          <textarea id="prompt-input" class="prompt-input" placeholder="Ask anything..." rows="1"></textarea>
          <button type="button" class="icon-btn ghost" id="attach-btn" aria-label="Attach image" title="Attach image">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </button>
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send message" title="Send">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" multiple hidden />
    </form>
    <div class="composer-foot">
      <span>Enter to send · Shift+Enter for new line · Paste images</span>
      <button class="link-btn" id="clear-chat">clear chat</button>
    </div>
  </footer>

  <!-- ============ SETTINGS MODAL ============ -->
  <div class="modal-overlay" id="settings-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title"><i class="fa-solid fa-gear"></i> Settings</h2>
        <button class="icon-btn" id="settings-close" aria-label="Close settings"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="modal-body">
        <label class="field">
          <span class="field-label">Groq API Key</span>
          <span class="field-hint">Leave blank to use the built-in demo key. Your key is stored only in your browser.</span>
          <div class="field-input">
            <input type="password" id="api-key-input" placeholder="gsk_..." autocomplete="off" />
            <button class="icon-btn ghost" id="toggle-key" type="button" aria-label="Show key"><i class="fa-solid fa-eye"></i></button>
          </div>
        </label>

        <label class="field">
          <span class="field-label">System prompt</span>
          <span class="field-hint">Tell the AI how to behave. It will format responses itself.</span>
          <textarea id="system-prompt" rows="3" placeholder="You are Nova, a helpful AI assistant..."></textarea>
        </label>

        <label class="field">
          <span class="field-label">Temperature <em id="temp-value">0.7</em></span>
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" />
        </label>

        <div class="field-row">
          <label class="switch">
            <input type="checkbox" id="stream-toggle" checked />
            <span class="slider"></span>
            <span>Stream responses</span>
          </label>
        </div>
      </div>

      <div class="modal-foot">
        <button class="btn ghost" id="reset-settings">Reset</button>
        <button class="btn primary" id="save-settings">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
